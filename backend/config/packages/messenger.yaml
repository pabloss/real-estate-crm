framework:
    messenger:
        default_bus: command.bus
        buses:
            command.bus:
                middleware:
                # Opcjonalnie: doctrine_transaction (jeśli komenda ma być w transakcji)
            query.bus:
                middleware:
                # Query nie powinno niczego zapisywać
            event.bus:
                default_middleware:
                    allow_no_handlers: true
