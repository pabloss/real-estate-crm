doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
#        auto_generate_proxy_classes: true
#        enable_lazy_ghost_objects: true
#        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            PropertyCatalogEntity:
                type: xml
                is_bundle: false
                # Dodano /Entity na końcu ścieżki
                dir: '%kernel.project_dir%/src/Modules/PropertyCatalog/Infrastructure/Persistence/Mapping/Entity'
                prefix: 'App\Modules\PropertyCatalog\Domain\Entity'
                alias: PropertyCatalogEntity
            PropertyCatalogVO:
                type: xml
                is_bundle: false
                # Dodano /ValueObject na końcu ścieżki
                dir: '%kernel.project_dir%/src/Modules/PropertyCatalog/Infrastructure/Persistence/Mapping/ValueObject'
                prefix: 'App\Modules\PropertyCatalog\Domain\ValueObject'
                alias: PropertyCatalogVO
            SalesCRMEntity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Modules/SalesCRM/Infrastructure/Persistence/Mapping/Entity'
                prefix: 'App\Modules\SalesCRM\Domain\Entity'
                alias: SalesCRMEntity
            SalesCRMVO:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Modules/SalesCRM/Infrastructure/Persistence/Mapping/ValueObject'
                prefix: 'App\Modules\SalesCRM\Domain\ValueObject'
                alias: SalesCRMVO
            IdentityAccessEntity:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Modules/IdentityAccess/Infrastructure/Persistence/Mapping/Entity'
                prefix: 'App\Modules\IdentityAccess\Domain\Entity'
                alias: IdentityAccessEntity

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
