version: '3.8'

services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: real_estate_crm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        # Pobiera ID z systemu hosta, z fallbackiem do 1000
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  frontend:
    image: node:20-alpine
    # Zmuszamy kontener Node, by używał Twoich lokalnych uprawnień
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Cache npm w osobnym wolumenie, aby uniknąć błędów braku uprawnień na głównym systemie plików kontenera
      - npm-cache:/.npm
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  db-data:
  npm-cache: