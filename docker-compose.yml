version: '3.8'

services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: real_estate_crm
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        # Pobiera ID z systemu hosta, z fallbackiem do 1000
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/var/www/html
    environment:
      # Zmienne dla Symfony Mercure Bundle
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:5173/.well-known/mercure
      MERCURE_JWT_SECRET: '1234'
    depends_on:
      - database
      - mercure # php musi widzieć mercure

  mercure:
    image: dunglas/mercure
    environment:
      # Klucz musi zgadzać się z tym w PHP
      MERCURE_PUBLISHER_JWT_KEY: '1234'
      MERCURE_SUBSCRIBER_JWT_KEY: '1234'
      # Zmieniamy '*' na jawny, dokładny adres frontendu:
      CORS_ALLOWED_ORIGINS: '*'
      # Tryb deweloperski bez HTTPS
      SERVER_NAME: ':80'
      ALLOW_ANONYMOUS: 1 # <--- Ta linijka rozwiązuje problem
    ports:
      - "9090:80"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  frontend:
    image: node:20-alpine
    # Zmuszamy kontener Node, by używał Twoich lokalnych uprawnień
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Cache npm w osobnym wolumenie, aby uniknąć błędów braku uprawnień na głównym systemie plików kontenera
      - npm-cache:/.npm
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  db-data:
  npm-cache: